{% extends "base.html" %}

{% block content %}
<div class="content">
  {% if user == current_user %}
  <a class="pure-button pure-button-secondary" href="{{ url_for('edit_profile') }}">Zmiana nazwy użytkownika</a>
  {% endif %}
<div class="header">
  <table class="pure-table" style="border:none;">
    <tr valign="top">
        <td><h1>Edycja: {{ user.username }}</h1></td>
        <!-- {% if user.last_seen %}<p> Ostatnie logowanie: {{ user.last_seen }}</p>
        {% endif %} -->
    </tr>
  </table>
</div>
{% for post in posts %}
  {% include '_post.html' %}
{% endfor %}

</div>
{% endblock %}
