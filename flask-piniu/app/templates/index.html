{% extends "base_anon.html" %}


{% block content %}
<div class="content_container">
<div class="post-container">
  <span class="pure-g" id="sortable-grid">
    {% for post in posts %}
    <div class="pure-u-1 {{ post.data }}" id="item_{{ post.id }}">
      {% include '_post.html' %}
    </div>
    {% endfor %}
    </span>
  </div>
</div>
  {% block footer %}
    {% include 'footer.html' %}
  {% endblock %}

{% endblock %}
