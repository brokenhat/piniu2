<div class="pure-u-1 pure-u-lg-1-1" id="first-el-header"><!-- first el. of header START-->

<!-- here goes pforms-------------------------------------- -->
<form class="pure-form" action="" method="post">
    {{ form.hidden_tag() }}
        <p class="form-label"> {{ form.post.label }} </p>
        {{ form.post() }}<br>
        {% for error in form.post.errors %}
          <span style="color:red;">[{{ error }}]</span>
        {% endfor %}
          <p class="pure-button click-for-hide">{{ form.submit() }}</p>
</form>


<ul class="hide-align">
  <li>
<span class="hide-el"> <img title="Schowaj" src="{{ url_for('static', filename='icons/hide.png') }}" alt="Schowaj"> </span>
  </li>
</ul>

</div> <!-- first el. of header ends -->
