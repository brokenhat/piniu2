{% extends "base.html" %}

{% block content %}
<div class="content">
  <div class="header"><h2>Zmień nazwę użytkownika</h2></div>

  <form class="pure-form action="" method="post">
    {{ form.hidden_tag() }}
    <p>
      {{ form.username.label }}<br>
      {{ form.username(size=32) }}<br>
      {% for error in form.username.errors %}
      <span style="color: red;">[{{ error }}]</span>
      {% endfor %}
    </p>
    <p>{{ form.submit() }}</p>
  </form>
</div>
{% endblock %}
