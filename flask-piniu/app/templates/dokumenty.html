<div class="pure-u-1 pure-u-lg-1-2" id="fourth-el-header"> <!-- third element of header START -->
<p>Udostępnij dla : </p>
  <ul id="inst-list">
{% for user in matchList %}
  {% for page in pages_other %}
  {% if page.title == user.username %}
  <li>
    <a class="pure-button pure-button-secondary" href="{{ url_for('editpage', id=page.id) }}">{{ user.username }}</a>
  </li>
  <a id="remove_inst" href="{{ url_for('delete_user', username=user.username, id=page.id) }}">Usuń</a>
  {% endif %}
  {% endfor %}
{% endfor %}
  </ul>
 <ul class="hide-align">
   <li>
     <span class="hide-el"> <img id="hide-el-area" title="Schowaj" src="{{ url_for('static', filename='icons/hide.png') }}" alt="Schowaj"> </span>
   </li>
 </ul>
</div> <!-- third element of header END -->
